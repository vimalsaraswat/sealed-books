[workspace]
resolver = "3"
members = [
    "crates/core",
    "apps/server",
    "apps/desktop/src-tauri",
    "tools/harness",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Vimal Saraswat"]

[workspace.dependencies]
sealed-books-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Profiles must live at the workspace root. Cargo silently ignores `[profile.*]`
# in workspace members, which is where the Tauri template originally put this.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
